map cmd+b send_text all \u0006\u0006\u0062
map cmd+shift+e send_text all \x0b\x05
map ctrl+shift+g send_text all \u0006\u0006\u0067
map cmd+h send_text all \u0000h
map cmd+j send_text all \u0000j
map cmd+k send_text all \u0000k
map cmd+l send_text all \u0000l
map cmd+p send_text all \x10\x10
map cmd+w send_text all \x20\x77
map cmd+q no-op

map cmd+[ send_text all \x20[
map cmd+] send_text all \x20]
map cmd+{ send_text all \x20{
map cmd+} send_text all \x20}
map cmd+shift+[ send_text all \x20{
map cmd+shift+] send_text all \x20}
map ctrl+cmd+[ send_text all \u0000p
map ctrl+cmd+] send_text all \u0000n
map cmd+1 send_text all \x20\x31
map cmd+2 send_text all \x20\x32
map cmd+3 send_text all \x20\x33
map cmd+4 send_text all \x20\x34
map cmd+5 send_text all \x20\x35
map cmd+6 send_text all \x20\x36
map cmd+7 send_text all \x20\x37
map cmd+8 send_text all \x20\x38
map cmd+9 send_text all \x20\x39

map cmd+s send_text all \x1b[25~
map cmd+shift+s send_text all \x1b[26~

map cmd+shift+f send_text all \x10\x06
map alt+shift+f send_text all \x0d\x06
map cmd+shift+t send_text all \x20\x60
map cmd+t send_text all \x20\x74
map cmd+enter
map cmd+shift+i
