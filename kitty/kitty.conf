env TERMINAL_NAME=kitty

macos_option_as_alt both
macos_show_window_title_in all
macos_quit_when_last_window_closed yes
copy_on_select clipboard
enabled_layouts splits, *
hide_window_decorations titlebar-only
confirm_os_window_close 0

font_family      Hasklug Nerd Font Regular
bold_font        Hasklug Nerd Font Bold
italic_font      OperatorMono Nerd Font Book Italic
bold_italic_font OperatorMono Nerd Font Medium Italic

font_size 15.0
adjust_line_height 120%
disable_ligatures always

tab_bar_edge top
tab_bar_style separator
# tab_powerline_style round
tab_separator " "
tab_bar_background      #141b24
active_tab_foreground   #141b24
active_tab_background   #f2cc81
active_tab_font_style   normal
inactive_tab_foreground #f2cc81
inactive_tab_background #141b24
inactive_tab_font_style normal
tab_title_template " {title} "

cursor_blink_interval 0
cursor #ffffff
cursor_text_color #000000
background #000000
foreground #eaeaea
color0 #000000
color8 #666666
color1 #d54e53
color9 #ff3334
color2  #b9ca4a
color10 #9ec400
color3  #e6c547
color11 #e7c547
color4  #7aa6da
color12 #7aa6da
color5  #c397d8
color13 #b77ee0
color6  #70c0ba
color14 #54ced6
color7  #eaeaea
color15 #ffffff

map shift+enter send_text all \x1b[13;2u
map ctrl+enter send_text all \x1b[13;5u
# kitty_mod ctrl+space
# tmux like shortcuts
map shift+cmd+] no-op
# map ctrl+cmd+] next_tab
